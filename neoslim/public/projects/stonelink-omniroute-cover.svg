<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="50%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#05050e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c77a"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#967434"/>
    </linearGradient>
    <radialGradient id="neuralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(197, 160, 89, 0.22)"/>
      <stop offset="100%" stop-color="rgba(197, 160, 89, 0)"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="320" fill="url(#neuralGlow)"/>

  <!-- Neural Constellation Network (5 Nodes) -->
  <g transform="translate(400, 380)">
    <!-- Synapse Lines -->
    <line x1="0" y1="0" x2="-160" y2="-70" stroke="rgba(197, 160, 89, 0.45)" stroke-width="2" stroke-dasharray="5,4"/>
    <line x1="0" y1="0" x2="160" y2="-70" stroke="rgba(197, 160, 89, 0.45)" stroke-width="2" stroke-dasharray="5,4"/>
    <line x1="0" y1="0" x2="-130" y2="120" stroke="rgba(197, 160, 89, 0.45)" stroke-width="2"/>
    <line x1="0" y1="0" x2="130" y2="120" stroke="rgba(197, 160, 89, 0.45)" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-150" stroke="url(#gold)" stroke-width="2.5"/>

    <line x1="-160" y1="-70" x2="0" y2="-150" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
    <line x1="160" y1="-70" x2="0" y2="-150" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>

    <!-- Center Node: OmniRoute Core Hub -->
    <circle cx="0" cy="0" r="36" fill="#0f0f20" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="#c5a059"/>
    <text x="0" y="5" text-anchor="middle" fill="#1A1200" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">HUB</text>

    <!-- Node 1: Gemini (Top) -->
    <circle cx="0" cy="-150" r="26" fill="#0f0f20" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="-145" text-anchor="middle" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GEMINI</text>

    <!-- Node 2: Claude (Top-Right) -->
    <circle cx="160" cy="-70" r="26" fill="#0f0f20" stroke="#d97706" stroke-width="2"/>
    <text x="160" y="-65" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CLAUDE</text>

    <!-- Node 3: OpenAI (Top-Left) -->
    <circle cx="-160" cy="-70" r="26" fill="#0f0f20" stroke="#10b981" stroke-width="2"/>
    <text x="-160" y="-65" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GPT-4o</text>

    <!-- Node 4: Groq Free Tier (Bottom-Left) -->
    <circle cx="-130" cy="120" r="26" fill="#0f0f20" stroke="#06b6d4" stroke-width="2"/>
    <text x="-130" y="125" text-anchor="middle" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GROQ</text>

    <!-- Node 5: PentAG Local (Bottom-Right) -->
    <circle cx="130" cy="120" r="26" fill="#0f0f20" stroke="#a855f7" stroke-width="2"/>
    <text x="130" y="125" text-anchor="middle" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">PENTAG</text>
  </g>

  <!-- Clean Floating Holographic Badge at Bottom -->
  <g transform="translate(260, 680)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="rgba(197, 160, 89, 0.12)" stroke="url(#gold)" stroke-width="1"/>
    <text x="140" y="23" text-anchor="middle" fill="#c5a059" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="2">
      MULTI-LLM AI GATEWAY
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="50%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#05050e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c77a"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#967434"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(197, 160, 89, 0.22)"/>
      <stop offset="100%" stop-color="rgba(197, 160, 89, 0)"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="320" fill="url(#glow)"/>

  <!-- Blueprint Circles -->
  <g opacity="0.15" stroke="url(#gold)" stroke-width="1">
    <circle cx="400" cy="380" r="260" fill="none" stroke-dasharray="6,4"/>
    <circle cx="400" cy="380" r="190" fill="none"/>
  </g>

  <!-- Central Crest: Scales of Justice + Neural Ring -->
  <circle cx="400" cy="380" r="160" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-dasharray="8,6" opacity="0.7"/>

  <!-- Balance Scales Icon -->
  <g transform="translate(400, 370) scale(1.6)" stroke="url(#gold)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-50" x2="0" y2="45"/>
    <line x1="-30" y1="45" x2="30" y2="45"/>
    <line x1="-60" y1="-25" x2="60" y2="-25"/>
    <!-- Left Scale -->
    <line x1="-60" y1="-25" x2="-80" y2="15"/>
    <line x1="-60" y1="-25" x2="-40" y2="15"/>
    <path d="M-85,15 Q-60,35 -35,15 Z" fill="rgba(197, 160, 89, 0.2)"/>
    <!-- Right Scale -->
    <line x1="60" y1="-25" x2="40" y2="15"/>
    <line x1="60" y1="-25" x2="80" y2="15"/>
    <path d="M35,15 Q60,35 85,15 Z" fill="rgba(197, 160, 89, 0.2)"/>
  </g>

  <!-- Audio Waveform at Center Bottom -->
  <g transform="translate(240, 520)" stroke="url(#gold)" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="0" x2="20" y2="-15"/>
    <line x1="50" y1="0" x2="50" y2="-35"/>
    <line x1="80" y1="0" x2="80" y2="-60"/>
    <line x1="110" y1="0" x2="110" y2="-30"/>
    <line x1="140" y1="0" x2="140" y2="-75"/>
    <line x1="170" y1="0" x2="170" y2="-45"/>
    <line x1="200" y1="0" x2="200" y2="-85"/>
    <line x1="230" y1="0" x2="230" y2="-50"/>
    <line x1="260" y1="0" x2="260" y2="-70"/>
    <line x1="290" y1="0" x2="290" y2="-25"/>
    <line x1="320" y1="0" x2="320" y2="-10"/>
  </g>

  <!-- Clean Floating Holographic Badge at Bottom -->
  <g transform="translate(260, 680)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="rgba(197, 160, 89, 0.12)" stroke="url(#gold)" stroke-width="1"/>
    <text x="140" y="23" text-anchor="middle" fill="#c5a059" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="2">
      LEGAL AI &amp; VOICE INTAKE
    </text>
  </g>
</svg>

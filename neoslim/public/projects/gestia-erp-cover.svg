<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="50%" stop-color="#090a18"/>
      <stop offset="100%" stop-color="#05050e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c77a"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#967434"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(197, 160, 89, 0.20)"/>
      <stop offset="100%" stop-color="rgba(197, 160, 89, 0)"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="320" fill="url(#glow)"/>

  <!-- Blueprint Grid -->
  <g opacity="0.12" stroke="url(#gold)" stroke-width="1">
    <circle cx="400" cy="380" r="260" fill="none" stroke-dasharray="6,4"/>
    <circle cx="400" cy="380" r="180" fill="none"/>
  </g>

  <!-- Architectural Isometric Villa / Penthouse Wireframe -->
  <g transform="translate(400, 360)" stroke="url(#gold)" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <polygon points="0,-120 160,-35 0,50 -160,-35" fill="rgba(197, 160, 89, 0.08)"/>
    <polygon points="-160,-35 0,50 0,165 -160,80" fill="rgba(197, 160, 89, 0.03)"/>
    <polygon points="0,50 160,-35 160,80 0,165" fill="rgba(197, 160, 89, 0.05)"/>

    <!-- Upper Penthouse Glass Box -->
    <polygon points="0,-190 95,-140 0,-90 -95,-140" stroke-dasharray="5,4" fill="rgba(255, 255, 255, 0.02)"/>
    <line x1="-95" y1="-140" x2="-95" y2="-95"/>
    <line x1="95" y1="-140" x2="95" y2="-95"/>
    <line x1="0" y1="-90" x2="0" y2="-45"/>

    <!-- Voice Concierge Wave Pulse -->
    <circle cx="0" cy="50" r="95" stroke="rgba(197, 160, 89, 0.4)" stroke-dasharray="6,4"/>
    <circle cx="0" cy="50" r="150" stroke="rgba(197, 160, 89, 0.2)" stroke-dasharray="8,6"/>
  </g>

  <!-- Floating Holographic Badge -->
  <g transform="translate(260, 680)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="rgba(197, 160, 89, 0.12)" stroke="url(#gold)" stroke-width="1"/>
    <text x="140" y="23" text-anchor="middle" fill="#c5a059" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="2">
      LUXURY PROPTECH &amp; ERP
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="50%" stop-color="#080a18"/>
      <stop offset="100%" stop-color="#05050e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c77a"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#967434"/>
    </linearGradient>
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(197, 160, 89, 0.22)"/>
      <stop offset="100%" stop-color="rgba(197, 160, 89, 0)"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="320" fill="url(#phoneGlow)"/>

  <!-- Phone Mockup Frame + Algeria Delivery Radar -->
  <g transform="translate(400, 360)">
    <!-- Titanium Phone Outline -->
    <rect x="-95" y="-170" width="190" height="340" rx="34" fill="#0c0d1a" stroke="url(#gold)" stroke-width="2.6"/>
    <!-- Screen Inner Display -->
    <rect x="-85" y="-160" width="170" height="320" rx="26" fill="#060610"/>
    
    <!-- Dynamic Island Pill -->
    <rect x="-24" y="-150" width="48" height="12" rx="6" fill="#000000"/>

    <!-- Map & Waveform on Screen -->
    <circle cx="0" cy="-35" r="45" fill="none" stroke="rgba(197, 160, 89, 0.3)" stroke-dasharray="4,4"/>
    <circle cx="0" cy="-35" r="26" fill="rgba(197, 160, 89, 0.1)" stroke="#c5a059" stroke-width="1.5"/>
    <text x="0" y="-31" text-anchor="middle" fill="#c5a059" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">58 WILAYAS</text>

    <!-- Barcode at bottom of screen -->
    <g transform="translate(-50, 60)" fill="#c5a059">
      <rect x="0" y="0" width="3" height="30"/>
      <rect x="7" y="0" width="6" height="30"/>
      <rect x="16" y="0" width="2" height="30"/>
      <rect x="22" y="0" width="4" height="30"/>
      <rect x="30" y="0" width="7" height="30"/>
      <rect x="40" y="0" width="3" height="30"/>
      <rect x="47" y="0" width="5" height="30"/>
      <rect x="56" y="0" width="2" height="30"/>
      <rect x="62" y="0" width="8" height="30"/>
      <rect x="74" y="0" width="3" height="30"/>
      <rect x="80" y="0" width="5" height="30"/>
      <rect x="89" y="0" width="4" height="30"/>
      <rect x="97" y="0" width="3" height="30"/>
    </g>
    <text x="0" y="108" text-anchor="middle" fill="rgba(240,237,232,0.6)" font-family="'JetBrains Mono', monospace" font-size="9">YALIDINE COD VERIFIED</text>
  </g>

  <!-- Clean Floating Holographic Badge at Bottom -->
  <g transform="translate(260, 680)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="rgba(197, 160, 89, 0.12)" stroke="url(#gold)" stroke-width="1"/>
    <text x="140" y="23" text-anchor="middle" fill="#c5a059" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="2">
      NATIONAL COD LOGISTICS
    </text>
  </g>
</svg>

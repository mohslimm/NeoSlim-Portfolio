<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060610"/>
      <stop offset="50%" stop-color="#070918"/>
      <stop offset="100%" stop-color="#04050c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c77a"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#967434"/>
    </linearGradient>
    <radialGradient id="resortGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(197, 160, 89, 0.22)"/>
      <stop offset="100%" stop-color="rgba(197, 160, 89, 0)"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="320" fill="url(#resortGlow)"/>

  <!-- Superyacht & Luxury Villa Pier Icon -->
  <g transform="translate(400, 370) scale(1.5)" stroke="url(#gold)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-110,40 L-90,-10 L70,-10 L110,40 Z" fill="rgba(197, 160, 89, 0.1)"/>
    <path d="M-60,-10 L-40,-45 L40,-45 L60,-10 Z" fill="rgba(255, 255, 255, 0.05)"/>
    <line x1="0" y1="-45" x2="0" y2="-75"/>
    <line x1="-15" y1="-65" x2="15" y2="-65"/>
    <circle cx="0" cy="-75" r="4" fill="#c5a059"/>

    <path d="M-130,55 Q-90,45 -50,55 T30,55 T110,55 T150,55" stroke="rgba(197, 160, 89, 0.45)" stroke-width="2"/>
    <path d="M-110,70 Q-70,62 -30,70 T50,70 T130,70" stroke="rgba(197, 160, 89, 0.25)" stroke-width="1.5"/>
  </g>

  <!-- Clean Floating Holographic Badge at Bottom -->
  <g transform="translate(260, 680)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="rgba(197, 160, 89, 0.12)" stroke="url(#gold)" stroke-width="1"/>
    <text x="140" y="23" text-anchor="middle" fill="#c5a059" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="2">
      HOSPITALITY SAAS &amp; ERP
    </text>
  </g>
</svg>
